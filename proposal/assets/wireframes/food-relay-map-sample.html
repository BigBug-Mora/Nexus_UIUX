<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Relay · Pickup sample</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#deded5;color:#23271e;font:15px system-ui,sans-serif}main{max-width:420px;margin:24px auto;border-radius:30px;overflow:hidden;background:#fcfcf7;border:1px solid #babeb0}header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#263226;color:#fff}header small{color:#d7e2ca}.map{position:relative;background:#e3e7da}.map svg{display:block;width:100%;height:310px}.tag{position:absolute;top:14px;left:16px;background:#fbfcf6;border-radius:20px;padding:8px 12px;font-size:12px;font-weight:700}.sheet{position:relative;margin-top:-20px;background:#fcfcf7;border-radius:24px 24px 0 0;padding:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;letter-spacing:-.04em;margin:4px 0}small{color:#53604f}.qty{padding:9px 12px;background:#e7eddf;border-radius:8px;font-weight:700;white-space:nowrap}ol{list-style:none;padding:0;margin:16px 0}li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #d9ddd3}li time{margin-left:auto;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#263226}.end{border-radius:2px;background:#995634}button{font:inherit;cursor:pointer;border:0;border-radius:13px;background:#d6eb91;color:#222a16;font-weight:750;width:100%;min-height:50px}button:disabled{background:#e1e8d7;cursor:default}.secondary{background:transparent;margin-top:5px;font-size:13px}dialog{border:0;border-radius:18px;padding:20px;width:min(340px,90vw);color:inherit}dialog::backdrop{background:#18231880}@media(max-width:440px){main{margin:0;border:0;border-radius:0}}
</style>
<main>
<header><strong>Food Relay</strong><small>Volunteer · Colombo</small></header>
<div class="map">
<span class="tag">5 km · Motorcycle</span>
<svg viewBox="0 0 420 310" role="img" aria-label="Illustrative route from the restaurant to the community centre">
<rect width="420" height="310" fill="#e4e8db"/>
<path d="M0 205 Q84 156 104 64L141 0H0Z" fill="#c6d9d8"/>
<path d="M279 0h89v68h-89zM222 212h87v66h-87z" fill="#cdd9bb"/>
<g fill="none" stroke="#fafaf4" stroke-width="8"><path d="M124 0 169 310M196 0 222 310M266 0 309 310M338 0 383 310M404 0 410 310M0 95 420 61M0 153 420 123M0 220 420 188M0 282 420 250"/></g>
<path d="M145 141 207 136 213 203 294 197 280 133 357 128" fill="none" stroke="#fcfcf7" stroke-width="12" stroke-linejoin="round"/>
<path d="M145 141 207 136 213 203 294 197 280 133 357 128" fill="none" stroke="#304b37" stroke-width="6" stroke-linejoin="round"/>
<circle cx="145" cy="141" r="9" fill="#263226" stroke="#fff" stroke-width="3"/>
<rect x="349" y="120" width="16" height="16" rx="3" fill="#995634" stroke="#fff" stroke-width="3"/>
<g font-family="system-ui" font-size="12" fill="#344735"><text x="122" y="169">Pickup</text><text x="324" y="110">Drop-off</text></g>
</svg>
</div>
<section class="sheet">
<div class="row"><div><small id="status" role="status">Suggested pickup</small><h1>Sealed bread packs</h1></div><span class="qty">12 packs</span></div>
<ol><li><span class="dot"></span>Restaurant pickup <time>17:45</time></li><li><span class="dot end"></span>Community centre <time>18:03 ETA</time></li></ol>
<button id="accept" type="button">Accept pickup</button>
<button class="secondary" id="route" type="button">View route details</button>
</section>
</main>
<dialog><h2>Route details</h2><p>Pick up 12 sealed packs between 17:35 and 17:55. The community centre receives donations until 18:20.</p><form method="dialog"><button>Close</button></form></dialog>
<script>
const accept = document.querySelector('#accept');
accept.addEventListener('click', () => {
  document.querySelector('#status').textContent = 'Pickup accepted';
  accept.textContent = 'Pickup accepted';
  accept.disabled = true;
});
document.querySelector('#route').addEventListener('click', () => document.querySelector('dialog').showModal());
</script>
</html>
